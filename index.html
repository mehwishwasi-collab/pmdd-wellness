<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="PMDD Wellness"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>PMDD Wellness</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;background:#f5f5f3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px}

.app{max-width:430px;margin:0 auto;background:#f5f5f3;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}

/* HERO */
.hero{background:#fff;padding:calc(env(safe-area-inset-top) + 20px) 16px 16px;border-bottom:1px solid #ebebeb}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.hero-day{font-size:48px;font-weight:700;line-height:1;color:#1a1a1a;letter-spacing:-2px}
.hero-day-label{font-size:12px;color:#888;margin-top:2px}
.hero-right{text-align:right;padding-top:4px}
.phase-chip{display:inline-block;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;letter-spacing:0.02em}
.chip-follicular{background:#eaf3de;color:#276322}
.chip-luteal{background:#fce8e8;color:#8b1f1f}
.chip-period{background:#faeeda;color:#7a4010}
.hero-date{font-size:11px;color:#aaa;margin-top:3px}
.phase-bar{display:flex;gap:2px;margin-bottom:12px;border-radius:3px;overflow:hidden}
.phase-seg{height:5px;flex:1;transition:flex 0.3s}
.hero-summary{font-size:13px;color:#555;line-height:1.65;background:#f9f9f7;border-radius:10px;padding:11px 13px}
.hero-summary strong{color:#1a1a1a;font-weight:600}
.period-btn{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid #e5e5e5;background:#fff;font-size:12px;color:#888;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.period-btn:active{background:#f5f5f3}
.prog-wrap{height:3px;background:#f0f0f0;border-radius:2px;margin-top:10px}
.prog-fill{height:3px;border-radius:2px;background:#1a1a1a;transition:width 0.4s}

/* SECTIONS */
.section{padding:14px 12px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.section-title{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#aaa}
.section-meta{font-size:11px;color:#bbb}

/* WORKOUT */
.workout-card{background:#fff;border:1px solid #ebebeb;border-radius:14px;overflow:hidden;margin-bottom:8px}
.workout-head{padding:13px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0}
.workout-icon{font-size:26px}
.workout-title{font-size:15px;font-weight:600;color:#1a1a1a}
.workout-focus{font-size:12px;color:#888;margin-top:1px}
.phase-workout-note{font-size:12px;padding:9px 14px;line-height:1.5;font-weight:500}
.note-warn{background:#fce8e8;color:#8b1f1f}
.note-ok{background:#eaf3de;color:#276322}
.exercise-list{padding:10px 14px 12px;display:flex;flex-direction:column;gap:7px}
.ex-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ex-name{font-size:13px;color:#1a1a1a;font-weight:500}
.ex-meta{font-size:11px;color:#999;margin-top:1px}
.ex-equip{background:#f5f5f3;padding:2px 7px;border-radius:5px;font-size:10px;color:#888;white-space:nowrap}
.cardio-row{border-top:1px solid #f0f0f0;padding:11px 14px;display:flex;align-items:center;gap:10px}
.cardio-text{flex:1;font-size:12px;color:#888;line-height:1.5}
.cardio-title{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:2px}
.rest-card{background:#fff;border:1px solid #ebebeb;border-radius:14px;padding:20px;text-align:center}
.rest-icon{font-size:36px;margin-bottom:10px}
.rest-title{font-size:17px;font-weight:600;color:#1a1a1a;margin-bottom:6px}
.rest-note{font-size:13px;color:#888;line-height:1.6;margin-bottom:14px}
.rest-activities{background:#f9f9f7;border-radius:10px;padding:12px;text-align:left}
.rest-act{font-size:13px;color:#666;padding:4px 0;display:flex;align-items:center;gap:8px}

/* MEDS */
.med-stack{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.med-block{background:#fff;border:1px solid #ebebeb;border-radius:14px;overflow:hidden;transition:border-color 0.2s}
.med-block.done-block{border-color:#86efac}
.med-block-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #f0f0f0}
.med-time{font-size:12px;font-weight:600;color:#888;flex:1}
.med-check{width:26px;height:26px;border-radius:50%;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;font-size:13px}
.med-check.done{background:#dcfce7;border-color:#86efac;color:#16a34a}
.med-items-list{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.med-row{display:flex;align-items:flex-start;gap:8px}
.med-dot{width:7px;height:7px;border-radius:50%;margin-top:4px;flex-shrink:0}
.d-rx{background:#ef4444}.d-stim{background:#7c3aed}.d-supp{background:#16a34a}.d-iron{background:#d97706}.d-glp{background:#2563eb}.d-mag{background:#7c3aed}
.med-text{font-size:13px;color:#1a1a1a;font-weight:500;line-height:1.4}
.med-sub{font-size:11px;color:#999;margin-top:1px}
.med-warn{font-size:11px;color:#d97706;padding:0 14px 10px;line-height:1.55;border-top:1px solid #fef3c7;padding-top:8px;background:#fffbeb}
.med-warn.critical{color:#dc2626;background:#fef2f2;border-top-color:#fecaca}
.wait-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.wait-line{flex:1;height:1px;background:#ebebeb;border-top:1px dashed #e0e0e0}
.wait-text{font-size:10px;color:#bbb;white-space:nowrap}

.priority-alert{background:#fce8e8;border:1px solid #fca5a5;border-radius:10px;padding:11px 13px;font-size:12px;color:#7f1d1d;line-height:1.65;margin-bottom:8px}
.priority-alert strong{font-weight:600}

.check-circle{width:26px;height:26px;border-radius:50%;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;font-size:13px}
.check-circle.done{background:#dcfce7;border-color:#86efac;color:#16a34a}

.footer-space{height:32px}

/* SETUP */
.setup{background:#fff;min-height:100vh;padding:calc(env(safe-area-inset-top) + 32px) 20px 32px;display:flex;flex-direction:column}
.setup-logo{font-size:32px;margin-bottom:6px}
.setup-title{font-size:24px;font-weight:700;color:#1a1a1a;letter-spacing:-0.5px;margin-bottom:8px}
.setup-sub{font-size:14px;color:#888;line-height:1.65;margin-bottom:28px}
.setup-label{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#bbb;margin-bottom:10px}
.setup-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:28px}
.setup-btn{padding:9px 2px;border-radius:8px;border:1px solid #ebebeb;background:#f9f9f7;cursor:pointer;font-size:12px;color:#888;text-align:center;transition:all 0.15s;-webkit-appearance:none}
.setup-btn.sel{background:#1a1a1a;border-color:#1a1a1a;color:#fff;font-weight:700}
.setup-submit{width:100%;padding:14px;border-radius:12px;border:none;background:#1a1a1a;color:#fff;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:0.01em;-webkit-appearance:none}
.setup-submit:active{opacity:0.85}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="mainView" style="display:none"></div>
  <div id="setupView"></div>
</div>

<script>
const STORAGE_KEY='pmdd_v2';

function load(){try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}catch(e){}}
function todayStr(){return new Date().toISOString().split('T')[0]}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/86400000)}
function getCycleDay(ps){return Math.max(1,daysBetween(ps,todayStr())+1)}
function getPhase(d){if(d<=5)return'period';if(d<=14)return'follicular';return'luteal'}

const WORKOUT_SPLIT=[
  {label:'Rest',icon:'🛁',type:'rest',notes:'Recovery is when muscle is built. Non-negotiable.',activities:['No gym today','Meal prep + protein tracking','Hydrate well — especially important in luteal phase']},
  {label:'Lower A',icon:'🦵',type:'workout',focus:'Quads + Hamstrings',brain:'Compound lower body — BDNF spike',exercises:[{name:'Goblet squat',sets:4,reps:10,equip:'DB'},{name:'DB Romanian deadlift',sets:3,reps:10,equip:'DB'},{name:'Reverse lunge',sets:3,reps:12,equip:'DB'}],bonus:{name:'Step-ups',sets:2,reps:'12 each leg',equip:'DB'},notes:'Reverse lunge = more knee-friendly. Side lunge = adductors + glutes.'},
  {label:'Upper A',icon:'💪',type:'workout',focus:'Back + Shoulders (Pull)',brain:'Resistance — dopamine + norepinephrine',exercises:[{name:'Lat pulldown',sets:4,reps:10,equip:'Cable'},{name:'DB shoulder press',sets:3,reps:10,equip:'DB'},{name:'Cable row',sets:3,reps:12,equip:'Cable'}],bonus:null,notes:'Pull focus. Upper back protects posture long term.'},
  {label:'Rest / Walk',icon:'🌿',type:'rest',notes:'Active recovery. Especially valuable in luteal phase.',activities:['20-min outdoor walk','Stretching or yoga','No gym required']},
  {label:'Lower B',icon:'🍑',type:'workout',focus:'Glutes + Posterior Chain',brain:'Rhythmic movement — mood regulation',exercises:[{name:'Hip thrust',sets:4,reps:12,equip:'DB/Barbell'},{name:'Sumo DB deadlift',sets:3,reps:10,equip:'DB'},{name:'Leg press',sets:3,reps:12,equip:'Machine'}],bonus:null,notes:'Posterior chain. No quad overlap with Lower A.'},
  {label:'Upper B',icon:'🤸',type:'workout',focus:'Push + Arms + Rear Delts',brain:'Consistent exertion — cortisol regulation',exercises:[{name:'Incline DB press',sets:3,reps:10,equip:'DB'},{name:'Tricep pushdown',sets:3,reps:12,equip:'Cable'},{name:'Bicep curl',sets:3,reps:12,equip:'DB'},{name:'DB rear delt fly',sets:3,reps:12,equip:'DB'}],bonus:null,notes:'Rear delt fly = same as face pulls, no cable needed.'},
  {label:'Full Body',icon:'✨',type:'optional',focus:'Full Body — Optional',brain:'Full-body compound = highest neurological demand',exercises:[{name:'DB conventional deadlift',sets:3,reps:8,equip:'DB'},{name:'DB row',sets:3,reps:10,equip:'DB'},{name:'DB overhead press',sets:3,reps:10,equip:'DB'}],bonus:null,notes:'Optional. Adjust based on how you feel in your cycle.'}
];

const PHASE_INFO={
  period:{chip:'Period phase',chipClass:'chip-period',
    summary:'Estrogen and progesterone are at their lowest. <strong>Low energy is expected — not a failure.</strong> Prioritize iron-rich food with Vitamin C today. Magnesium tonight is essential. Rest is a valid workout choice.',
    workoutNote:'Period phase — reduce weight 20–30% or rest. Your body is working hard.',noteClass:'note-warn'},
  follicular:{chip:'Follicular phase',chipClass:'chip-follicular',
    summary:'Estrogen is rising — <strong>this is your highest energy and focus window.</strong> Vyvanse works best now. Push harder in workouts, tackle complex work. Brain and body are at peak receptiveness.',
    workoutNote:'Follicular phase — your strongest window. Full weight, full effort.',noteClass:'note-ok'},
  luteal:{chip:'Luteal phase',chipClass:'chip-luteal',
    summary:'Progesterone peaks then crashes — <strong>PMDD symptoms emerge Days 20–28.</strong> Estrogen drop depletes dopamine, making ADHD harder. Vyvanse is essential now. Never skip magnesium. Reduce workout weight 20%.',
    workoutNote:'Luteal phase — reduce weight 20%, focus on form. Showing up is the win.',noteClass:'note-warn'}
};

const MED_STEPS=[
  {id:'iron',time:'On waking — before anything else',icon:'⏰',
   items:[{dot:'d-iron',text:'Ferrous bisglycinate 25mg',sub:'Thorne / Solgar Gentle Iron / Pure Encaps Iron-C'},{dot:'d-iron',text:'Vitamin C 250mg',sub:'Together with iron + full glass of water'}],
   warn:'No food, no coffee, no other supplements yet.',warnType:'',after:'wait30'},
  {id:'rx',time:'30 min later — before breakfast',icon:'💊',
   items:[{dot:'d-rx',text:'Sertraline — your dose',sub:'Morning only — eliminates night sweats'},{dot:'d-stim',text:'Vyvanse — your dose',sub:'Take together, no negative interaction'}],
   warn:null,after:'wait15'},
  {id:'breakfast',time:'With breakfast',icon:'🌅',
   items:[{dot:'d-supp',text:'Fish oil 1,280mg (650 EPA / 450 DHA)',sub:'Confirmed correct dose'},{dot:'d-supp',text:'Vitex (chasteberry)',sub:'Daily — not just luteal. 3–6 months for effect'},{dot:'d-supp',text:'Calcium 500mg (2 × 250mg)',sub:'Skip if heavy dairy breakfast'},{dot:'d-iron',text:'Vitamin D 2,000 IU',sub:'With fattiest meal. Lab: 35 → target 50–80'},{dot:'d-supp',text:'AG1 or Garden of Life multi',sub:'Never both same day'}],
   warn:null,after:null},
  {id:'afternoon',time:'Afternoon — with lunch',icon:'☀️',
   items:[{dot:'d-supp',text:'Calcium 500mg (2 × 250mg)',sub:'4–6 hrs from morning dose. Skip on heavy dairy days'}],
   warn:null,after:null},
  {id:'night',time:'30–60 min before bed',icon:'🌙',
   items:[{dot:'d-mag',text:'Magnesium glycinate 360mg (3 × 120mg)',sub:'Never skip — especially Days 15–28. Never with calcium'}],
   warn:'Most important PMDD supplement. Do not skip.',warnType:'critical',after:null}
];

function getLutealAlert(d){
  if(d>=20)return'<strong>Days 20–28 — peak PMDD window.</strong> Magnesium tonight is non-negotiable. Estrogen is at its lowest — be kind to yourself. Vyvanse may feel less effective; this is the dopamine deficit, not failure.';
  if(d>=15)return'<strong>Luteal phase started.</strong> Stay consistent with your full stack, especially magnesium and calcium. Reduce workout intensity if needed.';
  return null;
}

let state=null,medChecked={},cardioChecked=false,setupDay=1;

function init(){
  state=load();
  const today=todayStr();
  if(!state||!state.periodStart){showSetup();return}
  if(state.lastDate!==today){state.lastDate=today;state.medChecked={};state.cardioChecked=false;save(state)}
  medChecked=state.medChecked||{};
  cardioChecked=state.cardioChecked||false;
  showMain();
}

function showSetup(){
  document.getElementById('mainView').style.display='none';
  document.getElementById('setupView').style.display='block';
  renderSetup();
}

function showMain(){
  document.getElementById('setupView').style.display='none';
  document.getElementById('mainView').style.display='block';
  renderMain();
}

function renderSetup(){
  const opts=Array.from({length:35},(_,i)=>i+1).map(d=>
    `<button class="setup-btn${d===setupDay?' sel':''}" onclick="pickSetupDay(${d})">${d}</button>`
  ).join('');
  document.getElementById('setupView').innerHTML=`
    <div class="setup">
      <div class="setup-logo">🌸</div>
      <div class="setup-title">PMDD Wellness</div>
      <div class="setup-sub">Your daily protocol, workout, and cycle guide — all in one place.<br><br>To get started, what day of your cycle are you on today? Day 1 = first day of your period.</div>
      <div class="setup-label">I am on cycle day</div>
      <div class="setup-grid" id="setupGrid">${opts}</div>
      <button class="setup-submit" onclick="submitSetup()">Start tracking</button>
    </div>`;
}

function pickSetupDay(d){
  setupDay=d;
  document.querySelectorAll('.setup-btn').forEach((b,i)=>b.classList.toggle('sel',i+1===d));
}

function submitSetup(){
  const t=new Date();
  const ps=new Date(t);
  ps.setDate(t.getDate()-(setupDay-1));
  state={periodStart:ps.toISOString().split('T')[0],lastDate:todayStr(),medChecked:{},cardioChecked:false};
  save(state);medChecked={};cardioChecked=false;
  showMain();
}

function renderMain(){
  const cycleDay=getCycleDay(state.periodStart);
  const phase=getPhase(cycleDay);
  const pi=PHASE_INFO[phase];
  const workout=WORKOUT_SPLIT[new Date().getDay()];
  const dateStr=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const done=Object.values(medChecked).filter(Boolean).length;
  const total=MED_STEPS.length;
  const pct=Math.round((done/total)*100);
  const alert=phase!=='follicular'?getLutealAlert(cycleDay):null;

  const segs=Array.from({length:28},(_,i)=>{
    const d=i+1,isNow=d===Math.min(cycleDay,28);
    const col=d<=5?'#f59e0b':d<=14?'#84cc16':'#f87171';
    return`<div class="phase-seg" style="background:${col};opacity:${isNow?1:0.25};${isNow?'flex:2.5':''}"></div>`;
  }).join('');

  let workoutHTML='';
  if(workout.type==='rest'){
    workoutHTML=`<div class="workout-card">
      <div class="workout-head"><div class="workout-icon">${workout.icon}</div><div><div class="workout-title">${workout.label}</div><div class="workout-focus">${workout.notes}</div></div></div>
      <div class="exercise-list">${workout.activities.map(a=>`<div class="rest-act">✓ ${a}</div>`).join('')}</div>
    </div>`;
  } else {
    const exRows=workout.exercises.map(e=>`
      <div class="ex-row">
        <div><div class="ex-name">${e.name}</div><div class="ex-meta">${e.sets} sets × ${e.reps} reps</div></div>
        <div class="ex-equip">${e.equip}</div>
      </div>`).join('');
    const bonusRow=workout.bonus?`<div class="ex-row" style="opacity:0.6">
      <div><div class="ex-name" style="font-size:12px">+ ${workout.bonus.name} <span style="color:#bbb;font-weight:400">(if time)</span></div><div class="ex-meta">${workout.bonus.sets} × ${workout.bonus.reps}</div></div>
      <div class="ex-equip">${workout.bonus.equip}</div></div>`:'';
    workoutHTML=`<div class="workout-card">
      <div class="workout-head"><div class="workout-icon">${workout.icon}</div><div><div class="workout-title">${workout.label}</div><div class="workout-focus">${workout.focus}</div></div></div>
      <div class="phase-workout-note ${pi.noteClass}">${pi.workoutNote}</div>
      <div class="exercise-list">${exRows}${bonusRow}</div>
      <div class="cardio-row">
        <button class="check-circle${cardioChecked?' done':''}" onclick="toggleCardio()">
          ${cardioChecked?'✓':''}
        </button>
        <div class="cardio-text"><div class="cardio-title">Cardio finisher</div>8 min incline walk (3.5mph / 10%) or 4 × 30s jump rope</div>
      </div>
    </div>`;
  }

  const medsHTML=MED_STEPS.map((step,si)=>{
    const isDone=!!medChecked[step.id];
    const itemsHTML=step.items.map(it=>`
      <div class="med-row">
        <div class="med-dot ${it.dot}"></div>
        <div><div class="med-text">${it.text}</div><div class="med-sub">${it.sub}</div></div>
      </div>`).join('');
    const warnHTML=step.warn?`<div class="med-warn${step.warnType==='critical'?' critical':''}">${step.warn}</div>`:'';
    const afterHTML=step.after==='wait30'?`<div class="wait-row"><div class="wait-line"></div><div class="wait-text">wait 30 min</div><div class="wait-line"></div></div>`:
      step.after==='wait15'?`<div class="wait-row"><div class="wait-line"></div><div class="wait-text">wait 15 min then eat breakfast</div><div class="wait-line"></div></div>`:'';
    return`
      <div class="med-block${isDone?' done-block':''}">
        <div class="med-block-head">
          <span style="font-size:18px">${step.icon}</span>
          <span class="med-time">${step.time}</span>
          <button class="med-check${isDone?' done':''}" onclick="toggleMed('${step.id}')">${isDone?'✓':''}</button>
        </div>
        <div class="med-items-list">${itemsHTML}</div>
        ${warnHTML}
      </div>${afterHTML}`;
  }).join('');

  document.getElementById('mainView').innerHTML=`
    <div class="hero">
      <div class="hero-top">
        <div><div class="hero-day">${cycleDay}</div><div class="hero-day-label">cycle day</div></div>
        <div class="hero-right">
          <div class="phase-chip ${pi.chipClass}">${pi.chip}</div>
          <div class="hero-date">${dateStr}</div>
        </div>
      </div>
      <div class="phase-bar">${segs}</div>
      <div class="hero-summary">${pi.summary}</div>
      <button class="period-btn" onclick="confirmPeriodReset()">🩸 My period started today — reset to Day 1</button>
      <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="section-title">Today's workout</span>
        <span class="section-meta">${new Date().toLocaleDateString('en-US',{weekday:'long'})}</span>
      </div>
      ${workoutHTML}
    </div>

    <div class="section" style="padding-bottom:14px">
      <div class="section-head">
        <span class="section-title">Your protocol today</span>
        <span class="section-meta">${done} / ${total} done</span>
      </div>
      ${alert?`<div class="priority-alert">${alert}</div>`:''}
      <div class="med-stack">${medsHTML}</div>
    </div>
    <div class="footer-space"></div>`;
}

function toggleMed(id){medChecked[id]=!medChecked[id];state.medChecked=medChecked;save(state);renderMain()}
function toggleCardio(){cardioChecked=!cardioChecked;state.cardioChecked=cardioChecked;save(state);renderMain()}
function confirmPeriodReset(){
  if(confirm('Reset to Day 1? This marks today as the first day of your period.')){
    state.periodStart=todayStr();state.medChecked={};state.cardioChecked=false;
    medChecked={};cardioChecked=false;save(state);renderMain();
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

init();
</script>
</body>
</html>
